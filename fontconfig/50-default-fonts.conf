<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Font default seragam ala macOS: SF Pro untuk teks, SF Mono untuk monospace (ikon Nerd Font dari JetBrains Mono) -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>SF Mono</family><family>JetBrainsMono Nerd Font</family></prefer></alias>
</fontconfig>
