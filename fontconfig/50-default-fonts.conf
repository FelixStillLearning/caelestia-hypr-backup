<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Font default seragam: SF Pro untuk teks, JetBrains Mono untuk monospace -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
