animations {
  enabled = yes

  # Custom Bouncy & Smooth Curves
  bezier = bouncy, 0.35, 1.15, 0.25, 1.0
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1
  bezier = snappy, 0.05, 1.1, 0.1, 1.0

  # Apply Bouncy to windows and workspaces
  animation = windows, 1, 5, snappy, popin 80%
  animation = windowsIn, 1, 5, bouncy, popin 80%
  animation = windowsOut, 1, 4, smoothOut, popin 80%
  animation = windowsMove, 1, 5, bouncy, slide
  
  # Workspaces slide with bouncy effect
  animation = workspaces, 1, 6, bouncy, slidefade 20%
  
  # Standard fades
  animation = border, 1, 3, snappy
  animation = fade, 1, 4, smoothIn
}
