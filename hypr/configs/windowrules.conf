# APPLIACTIONS BLUR & OPACITY
windowrule {
    name = multimedia_opacity
    match:tag = multimedia_video.*
    opacity = 0.95 0.9
}
windowrule {
    name = settings_opacity
    match:tag = settings.*
    opacity = 0.95 0.9
}
windowrule {
    name = nautilus_opacity
    match:class = ^(org\.gnome\.Nautilus)$
    opacity = 0.95 0.9
}
windowrule {
    name = editor_opacity
    match:class = ^(gedit|org\.gnome\.TextEditor|mousepad)$
    opacity = 0.95 0.9
}
windowrule {
    name = pavucontrol_opacity
    match:class = ^(org\.pulseaudio\.pavucontrol)$
    opacity = 0.95 0.9
}
windowrule {
    name = kitty_opacity
    match:class = ^(kitty)$
    opacity = 0.95 0.9
}
windowrule {
    name = messaging_opacity
    match:class = ^(discord|vesktop|org\.telegram\.desktop)$
    opacity = 0.95 0.9
}
windowrule {
    name = spotify_opacity
    match:class = ^(Spotify)$
    opacity = 0.95 0.9
}
windowrule {
    name = zen_opacity
    match:class = ^(zen.*)$
    opacity = 1.0 1.0
}
windowrule {
    name = code_opacity
    match:class = ^(code)$
    opacity = 0.95 0.9
}
windowrule {
    name = zapzap_opacity
    match:class = ^(ZapZap)$
    opacity = 0.95 0.9
}
windowrule {
    name = viewer_opacity
    match:tag = viewer.*
    opacity = 0.95 0.9
}

# LAYER RULES (Blur for UI elements)
layerrule {
    name = rofi_blur
    match:namespace = rofi
    blur = true
    ignore_alpha = 0.5
}
layerrule = animation popin 80%, namespace:rofi
layerrule {
    name = notifications_blur
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.69
}
layerrule {
    name = waybar_blur
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.5
}
layerrule {
    name = wlogout_blur
    match:namespace = wlogout
    blur = true
    ignore_alpha = 0.5
}
# SWAYNC BLUR & XRAY
layerrule {
    name = swaync_control_blur
    match:namespace = swaync-control-center
    blur = true
    ignore_alpha = 0.5
    xray = false
}
layerrule {
    name = swaync_notification_blur
    match:namespace = swaync-notification-window
    blur = true
    ignore_alpha = 0.5
    xray = false
}

# FLOAT RULES
windowrule {
    name = settings_float
    match:tag = settings.*
    float = true
}
windowrule {
    name = viewer_float
    match:tag = viewer.*
    float = true
}
windowrule {
    name = multimedia_float
    match:tag = multimedia_video.*
    float = true
    size = 900 506
}
windowrule {
    name = pavucontrol_float
    match:class = ^(org\.pulseaudio\.pavucontrol)$
    float = true
    size = 50% 60%
}

# Ignore maximize requests from apps
windowrule {
    name = suppress_maximize
    match:class = .*
    suppress_event = maximize
}

# POP UPS AND DIALOGUES
windowrule {
    name = save_dialog_float
    match:title = ^(Save As|Save a File|Pick Files)$
    float = true
    size = 50% 60%
    center = true
}
windowrule {
    name = open_dialog_float
    match:initial_title = ^(Open Files)$
    float = true
    size = 70% 60%
}

# Prevent idle/lock when watching video or fullscreen
windowrule {
    name = idle_inhibit_video
    match:class = ^(mpv|vlc|firefox)$
    idle_inhibit = focus
}
windowrule {
    name = idle_inhibit_fullscreen
    match:class = .*
    idle_inhibit = fullscreen
}

# xwaylandvideobridge
windowrule {
    name = xwayland_bridge
    match:class = ^(xwaylandvideobridge)$
    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}
