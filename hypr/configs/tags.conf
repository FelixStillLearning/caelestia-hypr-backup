windowrule = float 1, match:class ^([Mm]pv|vlc)$
windowrule = float 1, match:class ^(nm-applet|nm-connection-editor|blueman-manager|org.gnome.FileRoller)$
windowrule = float 1, match:class ^(org.gnome.DiskUtility|wihotspot(-gui)?)$
windowrule = float 1, match:class ^(org.gnome.SystemMonitor)$ # system monitor
windowrule = float 1, match:class ^(org.gnome.Evince)$ # document viewer 
windowrule = float 1, match:class ^(eog|org.gnome.Loupe)$ # image viewer
