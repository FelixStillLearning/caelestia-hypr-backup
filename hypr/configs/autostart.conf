# Autostart applications

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/scripts/cleanup_vscode.sh
exec-once = xwaylandvideobridge
exec-once = swayosd-server
exec-once = nm-applet
exec-once = waybar  
# exec-once = awww-daemon
exec-once = blueman-applet
exec-once = swaync
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = hyprpm reload -n
exec-once = systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal
exec-once = wl-paste -t text --watch cliphist store
exec-once = wl-paste -t image --watch cliphist store
## exec-once = wlsunset -l -6.2088 -L 106.8456 -t 3500 -T 6500
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = pactl load-module module-virtual-source source_name=VirtualMic master=alsa_input.pci-0000_05_00.6.HiFi__Mic2__source source_properties=device.description="Virtual_Microphone"
exec-once = sleep 2 && pactl set-default-source output.VirtualMic
