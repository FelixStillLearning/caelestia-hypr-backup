# === OPTIMASI LAPTOP FELIXDEV (VERSI BERSIH) ===

# Monitor
monitor = eDP-1,highres,auto,1

# Hemat Baterai
misc {
    vrr = 1
    vfr = false
}

# Gestur Touchpad
gestures {
    workspace_swipe = true
}

# Aturan Window
windowrule = idle_inhibit focus, match:class ^(mpv|vlc|firefox)$
windowrule = idle_inhibit fullscreen, match:class .*
