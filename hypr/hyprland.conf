 #============================================
# Costum Config Hyprland Configuration 
# User : Felixdev
# ==========================================

source = colors.conf

### MONITORS ###
monitor = eDP-1, 1920x1200@60, 0x0, 1
monitor = HDMI-A-1, preferred, auto, 1

### LAPTOP OPTIMIZATION ###
## merged inline; external source removed to avoid conflicts

### AUTOSTART & ENVS ###
source = ~/.config/hypr/configs/autostart.conf
source = ~/.config/hypr/configs/envs.conf

### MY PROGRAMS ###
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

ecosystem {
    enforce_permissions = 1
}

# Permissions for screen sharing
permission = /usr/bin/grim, screencopy, allow
permission = /usr/lib/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/bin/hyprpm, plugin, allow
permission = /usr/local/bin/hyprpm, plugin, allow
# Discord audio capture permission
permission = /usr/bin/discord, screencopy, allow
permission = /usr/bin/hyprlock, screencopy, allow

### TAGS ###
source= ~/.config/hypr/configs/tags.conf

### LOOK AND FEEL ###
source= ~/.config/hypr/configs/looknfeel.conf

### ANIMATIONS ###
source= ~/.config/hypr/configs/UserAnimations.conf

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

### WINDOWRULES AND LAYERRULES ###
source = ~/.config/hypr/configs/windowrules.conf

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

## Touchpad gestures (new gestures system)
gesture = 3, horizontal, workspace
# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# Prevent idle/lock when watching video or fullscreen

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    # vfr = false # opsi ini sudah dihapus di hyprland versi terbaru (selalu nyala by default)
    vrr = 1   # enable VRR (Adaptive Sync)
    allow_session_lock_restore = false
}

render {
	new_render_scheduling = true
}

### INPUT ###
source= ~/.config/hypr/configs/input.conf

### KEYBINDS ###
source= ~/.config/hypr/configs/keybinds.conf

#============================================
# PLUGINS CONFIGURATION
# ==========================================

plugin {
    hyprexpo {
        columns = 3
        gaps_in = 5
        gaps_out = 15
        bg_col = rgb(111111)
        workspace_method = center current
        # gesture_distance = 300
    }

    hyprtrails {
        color = rgba(ffaa00ff)
    }

  
}
